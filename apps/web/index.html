<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#00007b" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/brand/chevrons.svg" />
    <link rel="preload" href="/fonts/nexa-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/helvetica-arabic-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/helvetica-arabic-roman.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>MC2026 · ملتقى الصناع</title>
    <style>
      /* First paint before any JS: the brand navy with the chevron trail, so the app never opens on white. */
      html {
        background: #00007b;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #00007b;
      }
      #boot svg {
        width: 72px;
        height: auto;
        animation: boot-pulse 1.1s ease-in-out infinite alternate;
      }
      @keyframes boot-pulse {
        from {
          opacity: 0.45;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Loading">
        <svg viewBox="66 990 190 56" aria-hidden="true">
          <path fill="#74dccf" d="M252.45 1017.69 207.89 991.96v51.45Z" />
          <path fill="#4a68d8" d="M182.95 1017.69 138.39 991.96v51.45Z" />
          <path fill="#fff" d="M113.45 1017.69 68.89 991.96v51.45Z" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
